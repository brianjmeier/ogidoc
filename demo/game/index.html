<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tic-tac-toe</title>
<style>
  :root { color-scheme: light dark; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 18px; background: Canvas; color: CanvasText; }
  .board { display: grid; grid-template-columns: repeat(3, 84px); gap: 6px; }
  .board button { width: 84px; height: 84px; font: 700 40px/1 inherit; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 10px; background: color-mix(in srgb, CanvasText 4%, Canvas); color: inherit; cursor: pointer; }
  .status { margin: 0; text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div class="board" aria-label="Board"></div>
<p class="status" aria-live="polite"></p>
<script type="module">
  import { click, newGame, status } from "./src/game.js";
  let game = newGame();
  const board = document.querySelector(".board");
  const line = document.querySelector(".status");
  const cells = Array.from({ length: 9 }, (_, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `Cell ${i + 1}`);
    b.onclick = () => { game = click(game, i); draw(); };
    return board.appendChild(b);
  });
  const draw = () => { cells.forEach((b, i) => (b.textContent = game.board[i] ?? "")); line.textContent = status(game); };
  draw();
</script>
</body>
</html>
